name: Deploy Project Aegis Live WebSocket UI & Keep-Alive

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package Live WebSocket Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
