services:
  - type: web
    name: aegis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CAPITAL
        value: "15000"
      - key: BROKER_NAME
        value: "PAPER"